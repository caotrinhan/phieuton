{% extends 'base.html' %}
{% block title %}Upload dữ liệu | Tồn lắp đặt{% endblock %}
{% block content %}
<div class="page-heading">
  <div>
    <p class="eyebrow">DAILY INGESTION</p>
    <h1>Upload dữ liệu ngày</h1>
    <p>Chọn file template mới của Cà Mau và Bạc Liêu. Hệ thống lưu các phiếu có mã thuê bao và ngày yêu cầu hợp lệ.</p>
  </div>
</div>

<form class="panel upload-form" method="post" enctype="multipart/form-data" action="{{ url_for('main.upload_new_template') }}">
  <h3 style="margin-bottom: 12px; font-size: 15px; color: var(--green);">Upload hai file template mới</h3>
  <label><span>File Cà Mau (Mới)</span><input type="file" name="ca_mau_moi" accept=".xlsx,.xls" required><small>Template mới Cà Mau...</small></label>
  <label><span>File Bạc Liêu (Mới)</span><input type="file" name="bac_lieu_moi" accept=".xlsx,.xls" required><small>Template mới Bạc Liêu...</small></label>
  <button class="button secondary" type="submit">Xử lý và lưu dữ liệu</button>
</form>
{% endblock %}
